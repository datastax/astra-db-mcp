name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node >=22.14.0 is required (engines field in package.json).
          node-version: '22'
          cache: 'npm'

      - name: Install npm >=12.0.0
        # actions/setup-node does not support an npm-version input — the bundled npm
        # for the node 22 runner image can be as old as 10.x. npm >=12.0.0 is required
        # by the engines field in package.json (npm stage was introduced in npm v12).
        run: npm install -g npm@latest

      - name: Install dependencies
        # --legacy-peer-deps: @modelcontextprotocol/inspector has a transitive peer
        # dep chain (inspector → vite@^8 → esbuild@^0.27||^0.28) that conflicts
        # with other peers at resolution time. This flag matches the flag already
        # used in release-on-main.yml.
        run: npm ci --legacy-peer-deps

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build
