# @author Madhavan Sridharan
name: Tag and Publish on Merge
  
on:
  # Trigger only when a pull request targeting main is closed.
  # The job-level `if` condition below further narrows this to:
  #   1. PRs that were actually merged (not just closed/abandoned), AND
  #   2. PRs whose head branch starts with 'release/bump-tag-version-and-update-changelog'
  #      — the branch prefix used exclusively by the tag-release.yml workflow.
  # This ensures the release pipeline fires only on merges of release PRs,
  # not on every direct push or unrelated PR merge into main.
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  release:
    # Guard: only run when the PR was merged AND originated from the release branch
    # created by tag-release.yml. The startsWith check handles the short-commit-hash
    # suffix appended to the branch name by peter-evans/create-pull-request.
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/bump-tag-version-and-update-changelog')
    name: Create Git Tag, GitHub Release, and Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for pushing tags and creating releases
      id-token: write # Needed for npm provenance
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node >=22.14.0 is required by npm staged publishing (npm stage publish).
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install npm >=12.0.0
        # actions/setup-node does not support an npm-version input — the bundled npm
        # for the node 22 runner image can be as old as 10.x. npm stage publish
        # was introduced in npm v12.0.0-pre.0.0 (2026-05-20) and does not exist in
        # any npm v11 release. We pin to the latest stable v12 explicitly here.
        run: npm install -g npm@latest

      - name: Install dependencies (including devDependencies)
        run: npm ci --legacy-peer-deps
        env:
          NODE_ENV: development

      - name: Run tests
        run: npm test
        # Temporary: skip tests for now
        #continue-on-error: true

      # Optional: build if needed (for TypeScript, bundlers, etc.)
      - name: Build package
        run: npm run build

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=v$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag ${{ steps.get_version.outputs.version }}
          git push origin ${{ steps.get_version.outputs.version }}

    #   - name: Create GitHub Release
    #     uses: softprops/action-gh-release@v1
    #     with:
    #       tag_name: ${{ steps.get_version.outputs.version }}
    #       name: Release ${{ steps.get_version.outputs.version }}
    #       generate_release_notes: true
    #     env:
    #       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (staged)
        # Stages the package on the npm registry without requiring 2FA/OTP.
        # The package is held in a staging area and is NOT publicly available until
        # a maintainer explicitly approves it with 2FA via:
        #   CLI:  npm stage approve <stage-id>
        #   Web:  npmjs.com → Staged Packages tab → Approve
        # Requires: npm CLI >=11.15.0, Node >=22.14.0 (both set in the setup step above).
        # See: https://docs.npmjs.com/staged-publishing
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
